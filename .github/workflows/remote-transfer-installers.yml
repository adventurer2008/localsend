name: Remote transfer installers
run-name: ${{ contains(github.event.head_commit.message, '[release]') && 'Release installers' || 'Vivo ARM64 test APK' }}

on:
  push:
    # A head commit with [release] builds the universal APK and Windows installer.
    branches: [build/remote-transfer-v1]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  # Increase for each new installable build so both Android packages can upgrade in place.
  BUILD_NUMBER: "69"

jobs:
  windows:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Prepare Windows build
        run: |
          rustup toolchain install --profile minimal
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix
      - run: flutter build windows --release "--build-number=$env:BUILD_NUMBER"
        working-directory: app
      - name: Build per-user installer
        run: |
          $payload = (Resolve-Path app/build/windows/x64/runner/Release).Path
          Copy-Item support/build/windows/x64/*.dll $payload
          '{}' | Set-Content "$payload/settings.json" -Encoding ascii
          Remove-Item "$payload/localsend_msix_helper.msix", "$payload/install_msix_helper.ps1", "$payload/localsend_app.exe.manifest" -ErrorAction SilentlyContinue
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc "/DPayloadDir=$payload" "/O$env:GITHUB_WORKSPACE\installers" support/scripts/remote-transfer-installer.iss
      - uses: actions/upload-artifact@v6
        with:
          name: LocalSend-Remote-Windows-x64
          path: installers/LocalSend-Remote-Windows-x64.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      RELEASE_BUILD: ${{ contains(github.event.head_commit.message, '[release]') }}
      GRADLE_OPTS: -Dorg.gradle.caching=true
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: android-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-cargo-${{ runner.os }}-${{ runner.arch }}-
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Prepare fixed signing and app ID
        env:
          ANDROID_STORE_BASE64: ${{ secrets.REMOTE_ANDROID_STORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.REMOTE_ANDROID_STORE_PASSWORD }}
        run: |
          rustup toolchain install --profile minimal
          sh support/scripts/remove_proprietary_dependencies.sh
          test -n "$ANDROID_STORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/remote-release.p12"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/remote-release.p12
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_STORE_PASSWORD
          keyAlias=localsend-remote
          storeType=pkcs12
          EOF
          sed -i 's/applicationId "org.localsend.localsend_app"/applicationId "org.localsend.localsend_app.remote"/' app/android/app/build.gradle
          sed -i 's/android:label="LocalSend"/android:label="LocalSend Remote"/' app/android/app/src/main/AndroidManifest.xml
      - name: Build Android APK
        working-directory: app
        run: |
          args=(--release "--build-number=$BUILD_NUMBER")
          if [[ "$RELEASE_BUILD" != true ]]; then
            args+=(--target-platform android-arm64)
          fi
          flutter build apk "${args[@]}"
      - name: Verify and stage APK
        id: apk
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          name=LocalSend-Remote-Android-Vivo-ARM64
          expected_abis=(arm64-v8a)
          if [[ "$RELEASE_BUILD" == true ]]; then
            name=LocalSend-Remote-Android
            expected_abis+=(armeabi-v7a x86_64)
          fi
          python3 - "$apk" "${expected_abis[@]}" <<'PY'
          import sys
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          apk_path, *expected_abis = sys.argv[1:]
          with ZipFile(apk_path) as apk:
              libraries = [PurePosixPath(entry) for entry in apk.namelist() if entry.startswith("lib/") and entry.endswith(".so")]
          apk_abis = {library.parts[1] for library in libraries}
          rust_abis = {library.parts[1] for library in libraries if library.name == "librust_lib_localsend_app.so"}
          if apk_abis != set(expected_abis) or rust_abis != set(expected_abis):
              sys.exit(f"Expected {expected_abis}, found APK ABIs {sorted(apk_abis)} and Rust ABIs {sorted(rust_abis)}")
          print(f"Verified APK and Rust ABIs: {sorted(apk_abis)}")
          PY
          cp "$apk" "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}.apk
          if-no-files-found: error
