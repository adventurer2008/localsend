definitions:
  instance: &ios_instance
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
  tools: &ios_tools
    flutter: 3.41.9
    xcode: '26.5'
    cocoapods: default
  dependencies: &ios_dependencies
    name: Prepare Flutter and Rust dependencies
    script: |
      set -euo pipefail
      if ! command -v rustup >/dev/null; then
        curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs | sh -s -- -y --profile minimal
        . "$HOME/.cargo/env"
      fi
      rustup toolchain install stable --profile minimal --target aarch64-apple-ios
      flutter pub get

workflows:
  ios-relay-compile:
    <<: *ios_instance
    name: iOS relay - unsigned IPA for Sideloadly
    environment: *ios_tools
    scripts:
      - name: Prepare the main app for personal signing
        script: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Clear dict' ios/Runner/Runner.entitlements
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = org\.localsend\.localsendApp/PRODUCT_BUNDLE_IDENTIFIER = io.github.adventurer2008.localsend.relay/' \
            ios/Runner.xcodeproj/project.pbxproj
      - *ios_dependencies
      - name: Compile for iPhone without signing
        script: flutter build ios --release --no-codesign
      - name: Package the main app as an unsigned IPA
        script: |
          set -euo pipefail
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          mkdir -p "$staging/Payload" build/ios/ipa
          ditto build/ios/iphoneos/Runner.app "$staging/Payload/Runner.app"
          rm -rf "$staging/Payload/Runner.app/PlugIns/ShareExtension.appex"
          ditto -c -k --norsrc --keepParent "$staging/Payload" build/ios/ipa/LocalSend-Relay-Unsigned.ipa
          unzip -tq build/ios/ipa/LocalSend-Relay-Unsigned.ipa
    artifacts:
      - app/build/ios/ipa/LocalSend-Relay-Unsigned.ipa

  ios-relay-adhoc:
    <<: *ios_instance
    name: iOS relay - Ad Hoc IPA
    environment:
      <<: *ios_tools
      groups:
        - ios_relay
      ios_signing:
        certificates:
          - relay_distribution
        provisioning_profiles:
          - relay_runner_adhoc
          - relay_share_adhoc
    scripts:
      - name: Configure the relay test targets
        script: python3 ../support/scripts/configure_ios_relay_build.py
      - *ios_dependencies
      - name: Apply the Ad Hoc profiles
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj \
            --archive-method ad-hoc --export-options-plist "$CM_BUILD_DIR/ios-relay-export.plist"
      - name: Build the signed IPA
        script: flutter build ipa --release --export-options-plist "$CM_BUILD_DIR/ios-relay-export.plist"
    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
